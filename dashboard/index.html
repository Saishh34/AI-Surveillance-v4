<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Surveillance Dashboard</title>
</head>

<body>
    <h1>AI Surveillance Dashboard</h1>

    <div id="cameras">
        Loading cameras...
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:5000";

        async function loadCameras() {
            const response = await fetch(`${API_BASE}/api/cameras`);
            const cameras = await response.json();

            const container = document.getElementById("cameras");

            container.innerHTML = "";

            for (const [name, camera] of Object.entries(cameras)) {
                const card = document.createElement("div");

                card.innerHTML = `
                    <h2>${name}</h2>
                    <p>Status: ${camera.online ? "Online" : "Offline"}</p>
                    <p>FPS: ${camera.fps ?? 0}</p>
                    <p>Motion: ${camera.motion_detected ? "Detected" : "None"}</p>
                    <p>Persons: ${camera.person_count ?? 0}</p>
                    <p>Intrusion: ${camera.intrusion ? "YES" : "No"}</p>
                    <p>Recording: ${camera.recording ? "YES" : "No"}</p>
                `;

                container.appendChild(card);
            }
        }

        loadCameras();
        setInterval(loadCameras, 1000);
    </script>
</body>
</html>
